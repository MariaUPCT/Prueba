<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="es" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head>
	<title>JSF Hello World</title>
</h:head>
<h:body>
	<h1>
		<h:outputText value="Hola mundo!!!" />
	</h1>
	<p>
		<h:outputText value="#{helloBean.message}" />
	</p>
	<p>
		<h:link outcome="index2" value="Enlace a index2"></h:link>
	</p>
	<p>
		<h:link outcome="#{helloBean.userList()}" value="Enlace a userList"></h:link>
	</p>
	<p>
		<h:link outcome="#{helloBean.userList}" value="Enlace a userList2"></h:link>
	</p>
	<!-- Cargar una imagen -->
	<h:graphicImage library="images" name="jakarta.png" />
	<h2>
		<h:outputText value="Listado de productos" />
	</h2>

	<h:dataTable value="#{productBean.products}" var="p">
		<h:column>
			<f:facet name="header">ID</f:facet>
			<h:outputText value="#{p.id}" />
		</h:column>

		<h:column>
			<f:facet name="header">Name</f:facet>
			<h:outputText value="#{p.name}" />
		</h:column>

		<h:column>
			<f:facet name="header">Price</f:facet>
			<h:outputText value="#{p.price}" />
		</h:column>

		<f:facet name="footer"> 
		         Hay #{productBean.products.size()} productos. 
		</f:facet>
	</h:dataTable>
	<h:form>
		<h:outputLabel	for="email">Email</h:outputLabel>
		<h:inputText id="email" value="#{userBean.email}">
			<f:validateLength minimum="10" maximum="100"/>
		</h:inputText>
		<h:message for="email" style="color:red;"/>		
		<br/>
		<h:outputLabel	for="password">Password</h:outputLabel>
		<h:inputSecret value="#{userBean.password}"/>
		<h:commandButton value="Submit" action="user-details"/>
		
	</h:form>

</h:body>
</html>
