<ui:composition
        template="/templates/layout/private-layout.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:ui="http://java.sun.com/jsf/facelets"
        xmlns:o="http://omnifaces.org/ui"
        xmlns:p="http://primefaces.org/ui"
        xmlns:h="http://java.sun.com/jsf/html"
        xmlns:f="http://java.sun.com/jsf/core"
        xmlns:c="http://java.sun.com/jsp/jstl/core"
        xmlns:cc="http://java.sun.com/jsf/composite"
        xmlns:ifw="http://java.sun.com/jsf/composite/component"
        xmlns:sec="http://www.springframework.org/security/tags">
        
	<ui:define name="header">
		<f:metadata>
        	<f:viewAction action="#{adminMenuController.initTreeMenus}"/>
        </f:metadata>
	</ui:define>
	
	<ui:define name="title">Gestión Menús</ui:define>
	<ui:define name="description">Gestión de opciones de menú uPortal</ui:define>
    <ui:define name="semilla">
    	<li class="active">Gestión Menú (Árbol)</li>
	</ui:define>			
    
   <ui:define name="body">
   		<style>
   			.ui-treenode-children {
   				text-indent: 5px;
   			}
   			
   		</style>
   		<h:form class="ui-g">
   			<div class="ui-g-9">
	    		<p:commandButton styleClass="primary-btn" 
	    				value="Mostrar / ocultar más información"
	    				title="Muestra información extra como códigos de menú, grupos y servicios inactivos" 
	    				onclick="$('.orden, .codMenu, .menuGrupos, .inactivos').toggle()"/>
			</div>
			<div class="ui-g-3" align="right">
				<!-- Vista de TABLA -->
				<p:button
					value="Vista de TABLA" icon="fal fa-table" styleClass="btn-info"
					outcome="/menu_list.xhtml"/>
	    	</div>
    	
    		<div class="ui-g-9 ui-fluid">
			    <p:tree 
			    		value="#{adminMenuController.treeInfoMenus}" 
			    		var="menu"
			    		selectionMode="single"
			    		selection="#{adminMenuController.treeInfoMenusSelected}"
			    		id="treeInfoMenus">
			    		
			        <p:treeNode> 
			        	<p:outputLabel title="Cód. #{menu.codMenu}" rendered="#{menu.activo == 'S'}" style="color: #727272; font-weight: 500;"> 
			        		<span style="color: #AAAAAA" class="orden hide">#{menu.orden}.- </span> 
			        		<i class="#{menu.imagen}" style="margin-right: 10px"/>
			        		#{menu.titulo}
			        		<span style="color: #AAAAAA" class="codMenu hide">[#{menu.codMenu}]</span>
			        		<p:fragment rendered="#{not empty menu.uportalMenuGrupos}">
			        			<div class="menuGrupos hide">
			        				<p:spacer width="15px"/>
			        				<span style="color: #FF7F00">#{menu.uportalMenuGruposStr}</span>	
			        			</div> 
			        		</p:fragment>
			        	</p:outputLabel> 
			        	<p:outputLabel title="Cód. #{menu.codMenu}" rendered="#{menu.activo != 'S'}" style="color: #AAAAAA; font-weight: 500;" styleClass="inactivos hide"> 
			        		<span style="color: #AAAAAA" class="orden hide">#{menu.orden}.- </span> <i>#{menu.titulo}</i> <span style="color: #AAAAAA" class="codMenu hide">[#{menu.codMenu}]</span>
			        	</p:outputLabel> 			        	
			        </p:treeNode>  
			    </p:tree>
		    </div>
		</h:form>
	
	</ui:define>

</ui:composition>
