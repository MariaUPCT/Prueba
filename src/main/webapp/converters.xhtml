<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="es" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:h="http://xmlns.jcp.org/jsf/html">
<h:head>
	<title>JSF Hello World</title>
</h:head>
<h:body>
	<h1>
		<h:outputText value="Hola mundo!!!" />
	</h1>

	<h2>
		<h:outputText value="Listado de productos" />
	</h2>

	<h:dataTable value="#{productBean.products}" var="p" border="1">
		<h:column>
			<f:facet name="header">ID</f:facet>
			<h:outputText value="#{p.id}" />
		</h:column>

		<h:column>
			<f:facet name="header">Name</f:facet>
			<h:outputText value="#{p.name}" />
		</h:column>

		<h:column>
			<f:facet name="header">Price</f:facet>
			<h:outputText value="#{p.price}">
				<f:convertNumber minFractionDigits="3"></f:convertNumber>
			</h:outputText>
		</h:column>

		<h:column>
			<f:facet name="header">Register date</f:facet>
			<h:outputText value="#{p.registerDate}">
				<f:convertDateTime pattern="dd-M-yyyy" />
			</h:outputText>
		</h:column>
		<h:column>
			<f:facet name="header">Creation date</f:facet>
			<h:outputText value="#{p.creationDate}">
				<f:convertDateTime type="localDate" pattern="d/M/yyyy" />
			</h:outputText>
		</h:column> 
		<h:column>
			<f:facet name="header">Creation time</f:facet>
			<h:outputText value="#{p.creationTime}">
				<f:convertDateTime type="localDateTime" pattern="d-M-yyyy HH:mm" />
			</h:outputText>
		</h:column> 

		<f:facet name="footer"> 
		         Hay #{productBean.products.size()} productos. 
		</f:facet>
	</h:dataTable>



</h:body>
</html>
